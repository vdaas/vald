resources:
- manager.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: controller
  newName: controller
  newTag: latest
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
- files:
  - cm/vrs.yaml
  name: valdoperatorrelease-controller-manager-default-vrs
