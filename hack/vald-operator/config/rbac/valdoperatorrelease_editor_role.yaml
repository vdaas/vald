# This rule is not used by the project valdoperatorrelease itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the vald.vdaas.org.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: valdoperatorrelease
    app.kubernetes.io/managed-by: kustomize
  name: valdoperatorrelease-editor-role
rules:
- apiGroups:
  - vald.vdaas.org
  resources:
  - valdoperatorreleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - vald.vdaas.org
  resources:
  - valdoperatorreleases/status
  verbs:
  - get
