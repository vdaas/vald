# This rule is not used by the project mvaldrelease itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to vald.vdaas.org resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: mvaldrelease
    app.kubernetes.io/managed-by: kustomize
  name: mvaldrelease-viewer-role
rules:
- apiGroups:
  - vald.vdaas.org
  resources:
  - mvaldreleases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - vald.vdaas.org
  resources:
  - mvaldreleases/status
  verbs:
  - get
