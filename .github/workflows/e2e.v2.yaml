name: "Run E2E V2"
on:
  push:
    tags:
      - "*.*.*"
      - "v*.*.*"
      - "*.*.*-*"
      - "v*.*.*-*"
  pull_request:
    types:
      - "labeled"
  workflow_dispatch:
env:
  DATASET: fashion-mnist-784-euclidean.hdf5
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  detect-ci-container:
    permissions:
      contents: read
    if: startsWith(github.ref, 'refs/tags/') || (github.event.action == 'labeled' && startsWith(github.event.label.name,'actions/e2e-v2')) || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/_detect-ci-container.yaml
  build-matrix:
    timeout-minutes: 30
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      result: ${{ steps.build-matrix.outputs.result }}
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        id: build-matrix
        with:
          result-encoding: string
          # TODO: Fix the issue the readreplica returns 0 indices and add this case
          # - scenario: readreplica
          #   deployment: helm-chart
          #   cluster: kind
          #   environment: "null"
          script: |
            // Build a stable include-only matrix for strategy.matrix
            const baseInclude = [
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "null" },
              { scenario: "unary_crud",  deployment: "helm-chart", cluster: "k3d", environment: "null" },
              { scenario: "multi_crud",  deployment: "helm-chart", cluster: "k3d", environment: "null" },
              { scenario: "rollout",     deployment: "helm-chart", cluster: "k3d", environment: "null" },
              { scenario: "faiss_crud",  deployment: "helm-chart", cluster: "k3d", environment: "faiss" },
              { scenario: "stream_crud", deployment: "helm-operator", cluster: "k3d", environment: "null" },
              { scenario: "index_correction", deployment: "helm-chart", cluster: "k3d", environment: "management" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "management" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "mirror" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "profile" },
              { scenario: "zvec_crud", deployment: "helm-chart", cluster: "k3d", environment: "zvec", values: "zvec", insert_count: "1000", expected_index: "3000" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "failure" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "kill" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "partition" },
              { scenario: "stream_crud", deployment: "helm-chart", cluster: "k3d", environment: "bandwidth" }
            ];

            // Extract suffix from label using the fixed prefix
            const prefix = 'actions/e2e-v2/';
            const action = (context && context.payload && context.payload.action) ? context.payload.action : '';
            const label = (context && context.payload && context.payload.label && context.payload.label.name) ? context.payload.label.name : '';

            let suffix = '';
            if (action === 'labeled' && label.startsWith(prefix)) {
              suffix = label.slice(prefix.length);
            }

            core.info('Label: ' + label);
            core.info('Suffix: ' + (suffix || '<none>'));

            // Filter by combo string (substring match)
            function combo(o) {
              return o.scenario + '-' + o.deployment + '-' + o.cluster + '-' + (o.environment === null ? 'null' : String(o.environment));
            }

            let filtered = baseInclude;
            if (suffix) {
              filtered = baseInclude.filter(function(o) { return combo(o).indexOf(suffix) !== -1; });
            }

            // Fallback if nothing matches
            if (filtered.length === 0) {
              core.warning("No include matched '" + suffix + "'. Falling back to base include (" + baseInclude.length + " jobs).");
              filtered = baseInclude;
            } else {
              core.info('Matched ' + filtered.length + ' job(s).');
            }

            filtered = filtered.map(function(o) {
              const values = o.values || ((o.environment === 'profile' || o.environment === 'faiss') ? o.environment : 'lb');
              return Object.assign({
                values: values,
                insert_count: '10000',
                expected_index: '30000',
              }, o);
            });

            // Set output "result" as a JSON string
            const matrix = { include: filtered };
            core.info('Generated matrix:\n' + JSON.stringify(matrix, null, 2));
            return JSON.stringify(matrix);
  # Freshness gate: block the e2e container start until the dev-container image
  # that detect-ci-container resolved actually carries the PR head's toolchain
  # fingerprint. Without this, the e2e job races the (separately triggered)
  # dev-container rebuild and can pull a stale image built from main's toolchain
  # (e.g. an older Go), which fails the in-container build with
  # "compile: version does not match go tool version". Keyed on a toolchain
  # fingerprint (not the commit sha) so ordinary PRs that do not touch the
  # toolchain match on the first poll and wait zero time; only a toolchain-
  # changing PR waits for its rebuild. Fails open when the label is absent (an
  # image built before this gate existed) so it never blocks e2e spuriously.
  wait-dev-container:
    timeout-minutes: 30
    permissions:
      contents: read
    needs: [detect-ci-container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Match the ref the dev-container build labels the image from
          # (_docker-image.yaml checks out github.event.pull_request.head.sha),
          # so the fingerprint computed here equals the image label. The default
          # pull_request checkout is the merge ref, which would diverge whenever
          # the base branch changes a toolchain file and the PR does not.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Wait until the dev-container image matches the PR head toolchain
        shell: bash
        env:
          TAG: ${{ needs.detect-ci-container.outputs.TAG }}
        run: |
          # The freshness gate only applies to pull_request events, where a PR
          # can bump the toolchain and race its own dev-container rebuild. For
          # tag push / workflow_dispatch the resolved image (release/nightly) is
          # authoritative and may be a tag the dev-container build never pushes,
          # so enforcing the gate there would hang until timeout. Run the job
          # unconditionally (to keep the e2e `needs` satisfied) but no-op here.
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "freshness gate applies only to pull_request events; skipping for ${GITHUB_EVENT_NAME}."
            exit 0
          fi
          image="ghcr.io/vdaas/vald/vald-dev-container:${TAG}"
          label_key="org.vdaas.vald.dev-container.toolchain-fingerprint"
          expected="$(make -s docker/dev-container/toolchain-fingerprint)"
          echo "target image:  ${image}"
          echo "expected fingerprint: ${expected}"
          deadline=$((SECONDS + 25 * 60))
          interval=20
          while :; do
            # Distinguish "inspect failed" (tag not on ghcr yet / transient) from
            # "image exists but carries no fingerprint label". Only the latter is
            # a legitimate fail-open (an image built before this gate existed);
            # the former must keep waiting so the gate is not defeated at the very
            # moment a rebuild is still pushing.
            if raw="$(docker buildx imagetools inspect "${image}" --format '{{json .Image}}' 2>/dev/null)"; then
              actual="$(printf '%s' "${raw}" | jq -r --arg k "${label_key}" '[.. | objects | (.Labels? // {}) | .[$k]? // empty] | map(select(. != "")) | first // empty' 2>/dev/null || true)"
              if [ -z "${actual}" ]; then
                echo "::warning::${image} exists but has no ${label_key} label (image predates this gate); proceeding without freshness enforcement."
                exit 0
              fi
              if [ "${actual}" = "${expected}" ]; then
                echo "dev-container image matches the PR head toolchain fingerprint; proceeding."
                exit 0
              fi
              echo "dev-container not fresh yet: expected=${expected} actual=${actual}; retrying in ${interval}s"
            else
              echo "dev-container image ${image} not resolvable on ghcr yet (rebuild still pushing or transient error); retrying in ${interval}s"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::${image} did not converge to the PR head toolchain fingerprint before the timeout."
              echo "::error::expected=${expected} actual=${actual:-<unresolved>}"
              echo "::error::A dev-container rebuild from the PR head is required. Confirm the 'Build docker image: dev-container' workflow ran for this PR (actions/e2e-v2 or actions/build label) and finished pushing, then re-run e2e."
              exit 1
            fi
            sleep "${interval}"
          done
  e2e:
    timeout-minutes: 60
    permissions:
      contents: read
    needs: [detect-ci-container, build-matrix, wait-dev-container]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-matrix.outputs.result) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
      options: "--add-host host.docker.internal:host-gateway"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Setup E2E environment
        id: setup_e2e
        uses: ./.github/actions/setup-e2e
        with:
          require_k3d: ${{ matrix.cluster == 'k3d' }}
          require_kind: ${{ matrix.cluster == 'kind' }}
          require_k0s: ${{ matrix.cluster == 'k0s' }}
      - name: Set HELM_EXTRA_OPTIONS for index management jobs
        if: ${{ matrix.environment == 'management' }}
        run: |
          echo "HELM_EXTRA_OPTIONS=\"--values .github/helm/values/values-index-management-jobs.yaml\"" >> $GITHUB_ENV
      - name: Build local Rust agent image for Zvec
        if: ${{ matrix.environment == 'zvec' && matrix.cluster == 'k3d' }}
        shell: bash
        run: |
          make TAG=nightly docker/build/agent
          k3d image import vdaas/vald-agent:nightly -c vald
      - name: Deploy Vald by Helm Chart
        if: ${{ matrix.deployment == 'helm-chart' && matrix.environment != 'mirror' && matrix.scenario != 'readreplica' }}
        uses: ./.github/actions/e2e-deploy-vald
        with:
          # The FAISS scenario needs the Agent image switched from the
          # default vdaas/vald-agent-ngt to vdaas/vald-agent-faiss; append
          # that override last so it wins over k8s/vald/manifests' own
          # `--set agent.image.repository=...-agent-ngt` (see Makefile.d/e2e.mk
          # e2e/v2/actions/run/faiss for the equivalent local dev target).
          helm_extra_options: "${{ steps.setup_e2e.outputs.HELM_EXTRA_OPTIONS }}${{ matrix.environment == 'faiss' && ' --set agent.image.repository=vdaas/vald-agent-faiss' || matrix.environment == 'zvec' && ' --set agent.image.repository=vdaas/vald-agent' || '' }}"
          values: .github/helm/values/values-${{ matrix.values }}.yaml
          wait_for_selector: "app=vald-lb-gateway"
      - name: Deploy Vald Read Replica
        if: ${{ 'readreplica' == matrix.scenario }}
        id: deploy_vald_readreplica
        uses: ./.github/actions/e2e-deploy-vald-readreplica
        with:
          helm_extra_options: ${{ steps.setup_e2e.outputs.HELM_EXTRA_OPTIONS }}
          values: .github/helm/values/values-readreplica.yaml
          wait_for_selector: app=vald-lb-gateway
      - name: Deploy Vald-01
        if: ${{ matrix.environment == 'mirror' }}
        uses: ./.github/actions/e2e-deploy-vald
        with:
          namespace: vald-01
          helm_extra_options: "${{ steps.setup_e2e.outputs.HELM_EXTRA_OPTIONS }}"
          values: .github/helm/values/values-mirror-01.yaml
          wait_for_selector: app=vald-mirror-gateway
      - name: Deploy Vald-02
        if: ${{ matrix.environment == 'mirror' }}
        uses: ./.github/actions/e2e-deploy-vald
        with:
          namespace: vald-02
          helm_extra_options: "${{ steps.setup_e2e.outputs.HELM_EXTRA_OPTIONS }}"
          values: .github/helm/values/values-mirror-02.yaml
          wait_for_selector: app=vald-mirror-gateway
      - name: Deploy Mirror Target
        if: ${{ matrix.environment == 'mirror' }}
        run: |
          kubectl apply -f .github/helm/values/vald-mirror-target.yaml -n vald-01
          sleep 5s
          kubectl get pods -A && kubectl get vmt -o wide -A

      - name: Create Helm options for vald-helm-operator
        if: ${{ matrix.deployment == 'helm-operator' }}
        uses: ./.github/actions/setup-e2e
        id: vald_helm_operator
        with:
          target_images: "vdaas/vald-helm-operator"
          require_libhdf5: false
          require_go: false
          require_helm: false
          require_k3d: false
          require_kind: false
          require_k0s: false
      - name: Merge Docker image tag
        if: ${{ matrix.deployment == 'helm-operator' }}
        shell: bash
        run: |
          IMAGE_TAGS=(${{ steps.setup_e2e.outputs.IMAGE_TAGS }})

          for IMAGE_TAG in "${IMAGE_TAGS[@]}"
          do
            echo "IMAGE_TAG:${IMAGE_TAG}"

            ARR=(${IMAGE_TAG//=/ })
            FIELD=${ARR[0]}
            TAG="\"${ARR[1]}\""
            yq e ".spec.$FIELD=$TAG" -i ./.github/valdrelease/valdrelease.yaml
          done
      - name: Deploy Vald using Vald Helm Operator
        if: ${{ matrix.deployment == 'helm-operator' }}
        uses: ./.github/actions/e2e-deploy-vald-helm-operator
        with:
          helm_extra_options: "${{ steps.vald_helm_operator.outputs.HELM_EXTRA_OPTIONS }}"
          valdrelease: ./.github/valdrelease/valdrelease.yaml
          wait_for_selector: app=vald-lb-gateway

      - name: Deploy Chaos Mesh
        if: ${{ contains(fromJson('["failure","kill","partition","bandwidth"]'), matrix.environment) }}
        uses: ./.github/actions/deploy-chaos-mesh
        with:
          helm_extra_options: "--set networkChaos.${{ matrix.environment }}.enabled=true"

      - name: Deploy profefe
        if: ${{ matrix.environment == 'profile' }}
        shell: bash
        run: |
          make k8s/metrics/profefe/deploy
          kubectl patch cronjob kprofefe -p '{"spec": {"schedule": "*/1 * * * *"}}'
          sleep 3
          kubectl wait --for=condition=ready pod -l app=profefe --timeout=300s

      # TODO: correction & skip
      - name: Run E2E CRUD
        shell: bash
        run: |
          make hack/benchmark/assets/dataset/${{ env.DATASET }}
          if [[ "${{ matrix.environment }}" == "mirror" ]]; then
            export E2E_TARGET_NAMESPACE=vald-01
          fi
          kubectl get pods
          make e2e/v2 E2E_CONFIG=$(pwd)/tests/v2/e2e/assets/${{ matrix.scenario }}.yaml \
            E2E_PARALLELISM="4" \
            E2E_INSERT_COUNT="${{ matrix.insert_count }}" \
            E2E_EXPECTED_INDEX="${{ matrix.expected_index }}" \
            E2E_QPS="30" \
            E2E_SEARCH_COUNT="10" \
            E2E_UPDATE_COUNT="100" \
            E2E_BULK_SIZE="10"
      - uses: ./.github/actions/e2e-profile
        if: ${{ matrix.environment == 'profile' }}
        with:
          dispatch_user: ${{ secrets.DISPATCH_USER }}
          dispatch_token: ${{ secrets.DISPATCH_TOKEN }}

      - name: Debug
        if: ${{ always() }}
        run: |
          kubectl get nodes
          kubectl get pods
          kubectl describe pods
          kubectl describe pvc
          # Agents have been observed crash-looping with exit code 139
          # (SIGSEGV); --previous captures the crashed container's Go runtime
          # stack trace, which describe/get cannot show.
          for pod in $(kubectl get pods -l app=vald-agent -o name); do
            echo "=== ${pod} (previous container log tail) ==="
            kubectl logs "${pod}" --previous --tail=200 || true
          done

  slack-notification:
    timeout-minutes: 30
    permissions:
      contents: read
    name: "Slack notification"
    if: startsWith( github.ref, 'refs/tags/')
    needs:
      - e2e
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/notify-slack
        with:
          author_name: "E2E deploy test"
          slack_notify_webhook_url: ${{ secrets.SLACK_NOTIFY_WEBHOOK_URL }}
