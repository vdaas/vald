name: "Vald Operator E2E Tests"
on:
  pull_request:
    paths:
      - "hack/vald-operator/**"
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  vald-operator-e2e-tests:
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Setup Go environment
        if: ${{ inputs.require_go == 'true' }}
        uses: ./.github/actions/setup-go

      - name: Install kind
        run: |
          make kind/install

      - name: Verify kind installation
        run: kind version

      - name: Create kind cluster
        run: |
          sed -e 's/apiServerAddress: "127.0.0.1"/apiServerAddress: "'"$(grep host.docker.internal /etc/hosts | cut -f1)"'"/' \
            k8s/debug/kind/e2e.yaml | kind create cluster --config -
          kubectl cluster-info --context kind-kind

      - name: Running Test e2e
        run: |
          make k8s/external/cert-manager/deploy
          cd hack/vald-operator && make test-e2e

      # - name: Run E2E
      #   run: |
      #     make kind/install
      #     make kind/start
      #     cd hack/vald-operator && make test-e2e
      - name: Dump kind logs on failure
        if: failure()
        run: |
          cat > collect-cert-manager-debug.sh <<'EOF'
          #!/usr/bin/env bash
          set -x

          NS=mvaldrelease-system

          echo "===== cluster info ====="
          kubectl version
          kubectl cluster-info
          kubectl get nodes -o wide

          echo "===== namespaces ====="
          kubectl get ns
          kubectl get ns "$NS" --show-labels
          kubectl describe ns "$NS"

          echo "===== cert-manager installation ====="
          kubectl get ns cert-manager
          kubectl get pods -n cert-manager -o wide
          kubectl get deploy -n cert-manager -o wide
          kubectl get svc -n cert-manager -o wide
          kubectl get crd | grep cert-manager || true

          echo "===== cert-manager logs ====="
          kubectl logs -n cert-manager deploy/cert-manager --tail=300 || true
          kubectl logs -n cert-manager deploy/cert-manager-webhook --tail=300 || true
          kubectl logs -n cert-manager deploy/cert-manager-cainjector --tail=300 || true

          echo "===== cert-manager events ====="
          kubectl get events -n cert-manager --sort-by=.lastTimestamp || true

          echo "===== target namespace resources ====="
          kubectl get all -n "$NS" -o wide
          kubectl get pods -n "$NS" -o wide
          kubectl get deploy -n "$NS" -o wide
          kubectl get svc -n "$NS" -o wide
          kubectl get sa -n "$NS" -o wide
          kubectl get secret -n "$NS" -o wide
          kubectl get certificate,certificaterequest,issuer,clusterissuer -n "$NS" -o wide || true

          echo "===== expected secret ====="
          kubectl get secret webhook-server-cert -n "$NS" -o yaml || true

          echo "===== certificate details ====="
          kubectl describe certificate -n "$NS" || true
          kubectl get certificate -n "$NS" -o yaml || true

          echo "===== certificate request details ====="
          kubectl describe certificaterequest -n "$NS" || true
          kubectl get certificaterequest -n "$NS" -o yaml || true

          echo "===== issuer details ====="
          kubectl describe issuer -n "$NS" || true
          kubectl get issuer -n "$NS" -o yaml || true

          echo "===== controller-manager pod ====="
          kubectl get pods -n "$NS" -l control-plane=controller-manager -o wide
          kubectl describe pods -n "$NS" -l control-plane=controller-manager
          kubectl logs -n "$NS" -l control-plane=controller-manager --all-containers=true --tail=300 || true

          echo "===== webhook service ====="
          kubectl get svc -n "$NS" | grep webhook || true
          kubectl get endpoints -n "$NS" -o wide
          kubectl get endpoints -n "$NS" | grep webhook || true

          echo "===== webhook configurations ====="
          kubectl get mutatingwebhookconfigurations.admissionregistration.k8s.io -o wide
          kubectl get validatingwebhookconfigurations.admissionregistration.k8s.io -o wide

          kubectl get mutatingwebhookconfigurations.admissionregistration.k8s.io \
            mvaldrelease-mutating-webhook-configuration -o yaml || true

          kubectl get validatingwebhookconfigurations.admissionregistration.k8s.io \
            mvaldrelease-validating-webhook-configuration -o yaml || true

          echo "===== caBundle length check ====="
          kubectl get mutatingwebhookconfigurations.admissionregistration.k8s.io \
            mvaldrelease-mutating-webhook-configuration \
            -o go-template='{{ range .webhooks }}{{ len .clientConfig.caBundle }}{{ "\n" }}{{ end }}' || true

          kubectl get validatingwebhookconfigurations.admissionregistration.k8s.io \
            mvaldrelease-validating-webhook-configuration \
            -o go-template='{{ range .webhooks }}{{ len .clientConfig.caBundle }}{{ "\n" }}{{ end }}' || true

          echo "===== target namespace events ====="
          kubectl get events -n "$NS" --sort-by=.lastTimestamp || true

          echo "===== recent all-cluster warning events ====="
          kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp || true

          echo "===== relevant manifests currently applied ====="
          kubectl get certificate,issuer,secret,pods,svc,endpoints -n "$NS" -o yaml || true
          EOF

          chmod +x collect-cert-manager-debug.sh
          ./collect-cert-manager-debug.sh
