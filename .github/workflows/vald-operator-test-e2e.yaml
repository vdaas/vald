name: "Vald Operator E2E Tests"
on:
  pull_request:
    paths:
      - "cmd/operator/vald/**"
      - "pkg/operator/vald/**"
      - "charts/operator/vald/**"
      - "k8s/operator/vald/**"
      - "internal/k8s/**"
      - "tests/v2/e2e/**"
      - "dockers/operator/vald/Dockerfile"
      - "Makefile"
      - "Makefile.d/**"
      - ".github/workflows/vald-operator-test-e2e.yaml"
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  vald-operator-e2e-tests:
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Setup Go environment
        uses: ./.github/actions/setup-go

      - name: Install libhdf5-dev
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libhdf5-dev

      - name: Install k3d
        run: |
          make k3d/install

      - name: Run vald-operator E2E
        run: |
          make e2e/v2/actions/run/operator
