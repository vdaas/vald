name: "Run Helm lint"
on:
  pull_request:
    paths:
      - "charts/**"
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - "charts/**"
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  detect-ci-container:
    permissions:
      contents: read
    uses: ./.github/workflows/_detect-ci-container.yaml
  lint-chart:
    timeout-minutes: 30
    permissions:
      contents: read
    name: lint for ${{ matrix.chart.name }} chart
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    strategy:
      fail-fast: false
      matrix:
        chart:
          - name: vald
            path: charts/vald
            schema_target: helm/schema/vald
          - name: vald-helm-operator
            path: charts/operator/helm
            schema_target: helm/schema/operator/helm
          - name: vald-operator
            path: charts/operator/vald
            schema_target: helm/schema/operator/vald
          - name: vald-benchmark-operator
            path: charts/operator/benchmark
            schema_target: helm/schema/operator/benchmark
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - name: Check out code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: set git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Generate schema for ${{ matrix.chart.path }}
        run: |
          make ${{ matrix.chart.schema_target }}
      - name: Run lint for ${{ matrix.chart.path }}
        run: |
          helm lint ${{ matrix.chart.path }}
  lint-values-schema:
    timeout-minutes: 30
    permissions:
      contents: read
    name: lint for values schema
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
      options: "--add-host=host.docker.internal:host-gateway"
    steps:
      - name: Check out code.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: set git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - uses: ./.github/actions/setup-k3d
        with:
          options: "--api-port host.docker.internal:6443 --kubeconfig-update-default --kubeconfig-switch-context"
          agents: 3
          ingress_port: 8081
      - name: Generate ValdRelease schema
        run: |
          make helm/schema/crd/vald
      - name: Test to apply
        run: |
          kubectl create -f charts/operator/helm/crds/valdrelease.yaml
          sleep 3
          yq eval \
              '{"apiVersion": "vald.vdaas.org/v1", "kind": "ValdRelease", "metadata":{"name":"vald-cluster"}, "spec": .}' \
              charts/vald/values.yaml \
              | kubectl apply -f -
