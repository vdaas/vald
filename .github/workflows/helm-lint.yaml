name: "Run Helm lint"
on:
  pull_request:
    paths:
      - "charts/**"
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - "charts/**"
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  detect-ci-container:
    permissions:
      contents: read
    uses: ./.github/workflows/_detect-ci-container.yaml
  resolve-charts:
    timeout-minutes: 10
    permissions:
      contents: read
    name: resolve chart list
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    outputs:
      charts: ${{ steps.resolve.outputs.charts }}
    steps:
      - name: Check out code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: set git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Resolve chart list from charts/charts.yaml
        id: resolve
        run: |
          {
            echo "charts<<EOF"
            yq eval -o=json -I=0 '[.charts[] | select(.schema_target != "")]' charts/charts.yaml
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
  lint-chart:
    timeout-minutes: 30
    permissions:
      contents: read
    name: lint for ${{ matrix.chart.name }} chart
    runs-on: ubuntu-latest
    needs: [detect-ci-container, resolve-charts]
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.resolve-charts.outputs.charts) }}
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - name: Check out code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: set git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Generate schema for ${{ matrix.chart.path }}
        env:
          SCHEMA_TARGET: ${{ matrix.chart.schema_target }}
        run: |
          make "${SCHEMA_TARGET}"
      - name: Run lint for ${{ matrix.chart.path }}
        env:
          CHART_PATH: ${{ matrix.chart.path }}
        run: |
          helm lint "${CHART_PATH}"
  lint-values-schema:
    timeout-minutes: 30
    permissions:
      contents: read
    name: lint for values schema
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
      options: "--add-host=host.docker.internal:host-gateway"
    steps:
      - name: Check out code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: set git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - uses: ./.github/actions/setup-k3d
        with:
          options: "--api-port host.docker.internal:6443 --kubeconfig-update-default --kubeconfig-switch-context"
          agents: 3
          ingress_port: 8081
      - name: Generate ValdRelease schema
        run: |
          make helm/schema/crd/vald
      - name: Test to apply
        run: |
          kubectl create -f charts/operator/helm/crds/valdrelease.yaml
          sleep 3
          yq eval \
              '{"apiVersion": "vald.vdaas.org/v1", "kind": "ValdRelease", "metadata":{"name":"vald-cluster"}, "spec": .}' \
              charts/vald/values.yaml \
              | kubectl apply -f -
