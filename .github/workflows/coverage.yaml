name: "Coverage reporting"
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/coverage.yaml"
      - "internal/**"
      - "pkg/**"
      - "cmd/**"
  pull_request:
    paths:
      - ".github/workflows/coverage.yaml"
      - "internal/**"
      - "pkg/**"
      - "cmd/**"
  workflow_dispatch: {}
defaults:
  run:
    shell: bash
jobs:
  dump-contexts-to-log:
    timeout-minutes: 60
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dump-context
  detect-ci-container:
    permissions:
      contents: read
    uses: ./.github/workflows/_detect-ci-container.yaml
  coverage:
    timeout-minutes: 60
    permissions:
      contents: read
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 10
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Run coverage
        continue-on-error: true
        run: |
          make coverage
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{secrets.CODECOV_TOKEN}}
          files: ./coverage.out
      - name: Upload coverage report to deepsource
        run: |
          mv ./coverage.out ./cover.out
          # pipefail comes from the workflow-wide `defaults.run.shell: bash`, so a failed curl
          # cannot feed sh an empty script (which would exit 0 and end the retry loop)
          # the installer fetches the binary from GitHub without retrying; retry on transient 5xx
          ok=0
          for i in 1 2 3 4 5; do
            if curl --retry 10 --retry-connrefused --retry-delay 2 -fsSL https://deepsource.io/cli | sh; then
              ok=1
              break
            fi
            if [ "$i" -lt 5 ]; then sleep $((i * 5)); fi
          done
          [ "$ok" = 1 ] || { echo "the deepsource CLI could not be installed" >&2; exit 1; }
          ./bin/deepsource report --analyzer test-coverage --key go --value-file ./cover.out
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
