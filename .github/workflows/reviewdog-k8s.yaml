name: "Reviewdog - K8s manifests"
on:
  pull_request:
    paths:
      - "charts/**"
      - "k8s/**"
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - "charts/**"
      - "k8s/**"
defaults:
  run:
    shell: bash
jobs:
  dump-contexts-to-log:
    timeout-minutes: 30
    permissions:
      contents: read
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/dump-context
  detect-ci-container:
    permissions:
      contents: read
    uses: ./.github/workflows/_detect-ci-container.yaml
  kubeval-conflint:
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    name: runner / kubeval-conflint
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Run kubeval-conflint
        run: |
          set -vx
          # conflint is installed by the dev container image (make conflint/install). An image
          # built before that has none; skip instead of failing the step with "command not found".
          if ! command -v conflint >/dev/null; then
            echo "::warning::conflint is not installed in the dev container; skipping kubeval-conflint"
            exit 0
          fi
          conflint run -c .github/conflint.yaml -efm "%f:%l:%c: %m" || true
          { conflint run -c .github/conflint.yaml -efm "%f:%l:%c: %m" || true; } | reviewdog -efm="%f:%l:%c: %m" -reporter=${REPORTER} -tee
        env:
          CONFLINT_LOG: DEBUG
          # kubeval's default schema host (kubernetesjsonschema.dev) has an invalid certificate,
          # so no schema could be fetched and ignoreMissingSchemas hid that; use the maintained mirror.
          KUBEVAL_SCHEMA_LOCATION: https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORTER: github-pr-review
  kubelinter-k8s-manifests:
    timeout-minutes: 30
    permissions:
      contents: read
    name: runner / kubelinter
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Run kubelinter for k8s directory
        run: |
          kube-linter lint \
            --config .github/kubelinter.yaml \
            k8s/agent \
            k8s/discoverer \
            k8s/gateway \
            k8s/manager
  kubelinter-vald-chart:
    timeout-minutes: 30
    permissions:
      contents: read
    name: runner / kubelinter for vald chart
    runs-on: ubuntu-latest
    needs: [detect-ci-container]
    container:
      image: ghcr.io/vdaas/vald/vald-dev-container:${{ needs.detect-ci-container.outputs.TAG }}
      credentials:
        username: ${{ secrets.PACKAGE_USER }}
        password: ${{ secrets.PACKAGE_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set Git config
        run: |
          git config --global --add safe.directory ${GITHUB_WORKSPACE}
      - name: Run kubelinter for generated manifests
        run: |
          kube-linter lint \
            --config .github/kubelinter.yaml \
            charts/vald
