apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vald-operator
  labels:
    app: vald-operator
    app.kubernetes.io/name: vald
    app.kubernetes.io/component: vald-operator
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - vald.vdaas.org
    resources:
      - valdoperatorreleases
      - valdreleases
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - vald.vdaas.org
    resources:
      - valdoperatorreleases/finalizers
      - valdreleases/finalizers
    verbs:
      - update
  - apiGroups:
      - vald.vdaas.org
    resources:
      - valdoperatorreleases/status
      - valdreleases/status
    verbs:
      - get
      - patch
      - update
