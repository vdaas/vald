apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vald-operator-leader-election
  namespace: default
  labels:
    app: vald-operator
    app.kubernetes.io/name: vald
    app.kubernetes.io/component: vald-operator
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
