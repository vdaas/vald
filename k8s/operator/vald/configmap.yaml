apiVersion: v1
kind: ConfigMap
metadata:
  name: vald-operator-config
  namespace: default
  labels:
    app: vald-operator
    app.kubernetes.io/name: vald
    app.kubernetes.io/component: vald-operator
data:
  config.yaml: |
    version: v0.0.0
    time_zone: UTC
    logging:
      format: raw
      level: debug
      logger: glg
    server_config:
      servers:
        - name: grpc
          host: 0.0.0.0
          port: 8081
          grpc:
            bidirectional_stream_concurrency: 20
            connection_timeout: ""
            enable_admin: false
            enable_reflection: true
            header_table_size: 0
            initial_conn_window_size: 2097152
            initial_window_size: 1048576
            interceptors:
            - RecoverInterceptor
            - TraceInterceptor
            - MetricInterceptor
            keepalive:
              max_conn_age: ""
              max_conn_age_grace: ""
              max_conn_idle: ""
              min_time: 10m
              permit_without_stream: false
              time: 3h
              timeout: 60s
            max_header_list_size: 0
            max_receive_message_size: 0
            max_send_message_size: 0
            read_buffer_size: 0
            write_buffer_size: 0
          mode: GRPC
          network: tcp
          probe_wait_time: 3s
          restart: true
          socket_option:
            ip_recover_destination_addr: false
            ip_transparent: false
            reuse_addr: true
            reuse_port: true
            tcp_cork: false
            tcp_defer_accept: false
            tcp_fast_open: false
            tcp_no_delay: false
            tcp_quick_ack: false
          socket_path: ""
      health_check_servers:
        - name: liveness
          host: 0.0.0.0
          port: 3000
          http:
            handler_timeout: ""
            idle_timeout: ""
            read_header_timeout: ""
            read_timeout: ""
            shutdown_duration: 5s
            write_timeout: ""
          mode: ""
          network: tcp
          probe_wait_time: 3s
          socket_option:
            ip_recover_destination_addr: false
            ip_transparent: false
            reuse_addr: true
            reuse_port: true
            tcp_cork: false
            tcp_defer_accept: false
            tcp_fast_open: true
            tcp_no_delay: true
            tcp_quick_ack: true
          socket_path: ""
        - name: readiness
          host: 0.0.0.0
          port: 3001
          http:
            handler_timeout: ""
            idle_timeout: ""
            read_header_timeout: ""
            read_timeout: ""
            shutdown_duration: 0s
            write_timeout: ""
          mode: ""
          network: tcp
          probe_wait_time: 3s
          socket_option:
            ip_recover_destination_addr: false
            ip_transparent: false
            reuse_addr: true
            reuse_port: true
            tcp_cork: false
            tcp_defer_accept: false
            tcp_fast_open: true
            tcp_no_delay: true
            tcp_quick_ack: true
          socket_path: ""
      metrics_servers:
        - name: pprof
          host: 0.0.0.0
          port: 6060
          http:
            handler_timeout: 5s
            http2:
              enabled: false
              handler_limit: 0
              max_concurrent_streams: 0
              max_decoder_header_table_size: 4096
              max_encoder_header_table_size: 4096
              max_read_frame_size: 0
              max_upload_buffer_per_connection: 0
              max_upload_buffer_per_stream: 0
              permit_prohibited_cipher_suites: true
            idle_timeout: 2s
            read_header_timeout: 1s
            read_timeout: 1s
            shutdown_duration: 5s
            write_timeout: 1m
          mode: REST
          network: tcp
          probe_wait_time: 3s
          restart: true
          socket_option:
            ip_recover_destination_addr: false
            ip_transparent: false
            reuse_addr: true
            reuse_port: true
            tcp_cork: true
            tcp_defer_accept: false
            tcp_fast_open: false
            tcp_no_delay: false
            tcp_quick_ack: false
          socket_path: ""
      startup_strategy:
        - liveness
        - pprof
        - grpc
        - readiness
      shutdown_strategy:
        - readiness
        - grpc
        - pprof
        - liveness
      full_shutdown_duration: 600s
      tls:
        ca: /path/to/ca
        cert: /path/to/cert
        enabled: false
        insecure_skip_verify: false
        key: /path/to/key
    observability:
      enabled: false
      metrics:
        enable_cgo: true
        enable_goroutine: true
        enable_memory: true
        enable_version_info: true
        version_info_labels:
        - vald_version
        - server_name
        - git_commit
        - build_time
        - go_version
        - go_os
        - go_arch
        - algorithm_info
      otlp:
        attribute:
          namespace: _MY_POD_NAMESPACE_
          node_name: _MY_NODE_NAME_
          pod_name: _MY_POD_NAME_
          service_name: vald-operator
        collector_endpoint: opentelemetry-collector-collector.default.svc.cluster.local:4317
        metrics_export_interval: 1s
        metrics_export_timeout: 1m
        trace_batch_timeout: 1s
        trace_export_timeout: 1m
        trace_max_export_batch_size: 1024
        trace_max_queue_size: 256
      trace:
        enabled: false
    operator:
      controller:
        cache_namespaces: []
        leader_election:
          enabled: true
          id: vald-operator
          lease_duration: 30s
          namespace: _MY_POD_NAMESPACE_
          renew_deadline: 20s
          retry_period: 5s
        max_concurrent_reconciles: 2
        metrics_address: ""
        requeue:
          not_found: 1s
          on_error: 100ms
          success: ""
        sync_period: ""
      name: vald-operator
      namespace: default
      networking:
        discoverer_daemonset_max_surge: 30%
        discoverer_daemonset_max_unavailable: 0%
        enable_ingress: true
        gateway_ingress_annotations: {}
        gateway_service_type: NodePort
      node_pool:
        agent_pods_per_node: 2
        label_prefix: ""
        require_match: false
      persistent_volume:
        buffer_ratio: 1.5
        default_access_mode: ReadWriteOnce
        default_storage_class: standard
        min_size_bytes: 1073741824
      vrs:
        agent:
          enable_in_memory_mode: true
          max_surge: "1"
          max_unavailable: "1"
        default_vrs_path: /opt/valdoperatorrelease/config/vrs.yaml
        gateway:
          hpa_target_cpu_utilization: 80
          ingress_path_type: Prefix
          ingress_service_port: grpc
        indexer:
          auto_index_duration_limit: 1h
          auto_save_index_duration_limit: -1h
        log_format: raw
        log_level: warn
        logger: glg
        managed_generation_label: managed-generation
