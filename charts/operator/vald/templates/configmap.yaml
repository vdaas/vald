apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vald-operator.labels" . | nindent 4 }}
data:
  config.yaml: |
    version: {{ .Values.version }}
    time_zone: {{ .Values.time_zone }}
    logging:
      {{- toYaml .Values.logging | nindent 6 }}
    server_config:
      {{- include "vald-operator.server_config" . | nindent 6 }}
    observability:
      {{- toYaml .Values.observability | nindent 6 }}
    operator:
      {{- toYaml .Values.operator | nindent 6 }}
