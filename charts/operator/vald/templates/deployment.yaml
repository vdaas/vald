{{- $grpc := .Values.server_config.servers.grpc }}
{{- $liveness := .Values.server_config.healths.liveness }}
{{- $readiness := .Values.server_config.healths.readiness }}
{{- $startup := .Values.server_config.healths.startup }}
{{- $pprof := .Values.server_config.metrics.pprof }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vald-operator.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  replicas: {{ .Values.replicas }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  template:
    metadata:
      labels:
        {{- include "vald-operator.labels" . | nindent 8 }}
      {{- if or .Values.podAnnotations $pprof.enabled }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $pprof.enabled }}
        pyroscope.io/scrape: "true"
        pyroscope.io/application-name: {{ .Values.name }}
        pyroscope.io/profile-cpu-enabled: "true"
        pyroscope.io/profile-mem-enabled: "true"
        pyroscope.io/port: {{ $pprof.port | quote }}
        {{- end }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.name }}
          image: {{ include "vald-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $liveness.enabled }}
          livenessProbe:
            failureThreshold: {{ $liveness.livenessProbe.failureThreshold }}
            httpGet:
              path: {{ $liveness.livenessProbe.httpGet.path }}
              port: {{ $liveness.livenessProbe.httpGet.port }}
              scheme: {{ $liveness.livenessProbe.httpGet.scheme }}
            initialDelaySeconds: {{ $liveness.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ $liveness.livenessProbe.periodSeconds }}
            successThreshold: {{ $liveness.livenessProbe.successThreshold }}
            timeoutSeconds: {{ $liveness.livenessProbe.timeoutSeconds }}
          {{- end }}
          {{- if $readiness.enabled }}
          readinessProbe:
            failureThreshold: {{ $readiness.readinessProbe.failureThreshold }}
            httpGet:
              path: {{ $readiness.readinessProbe.httpGet.path }}
              port: {{ $readiness.readinessProbe.httpGet.port }}
              scheme: {{ $readiness.readinessProbe.httpGet.scheme }}
            initialDelaySeconds: {{ $readiness.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ $readiness.readinessProbe.periodSeconds }}
            successThreshold: {{ $readiness.readinessProbe.successThreshold }}
            timeoutSeconds: {{ $readiness.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if $startup.enabled }}
          startupProbe:
            failureThreshold: {{ $startup.startupProbe.failureThreshold }}
            httpGet:
              path: {{ $startup.startupProbe.httpGet.path }}
              port: {{ $startup.startupProbe.httpGet.port }}
              scheme: {{ $startup.startupProbe.httpGet.scheme }}
            initialDelaySeconds: {{ $startup.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ $startup.startupProbe.periodSeconds }}
            successThreshold: {{ $startup.startupProbe.successThreshold }}
            timeoutSeconds: {{ $startup.startupProbe.timeoutSeconds }}
          {{- end }}
          ports:
            {{- if $liveness.enabled }}
            - name: liveness
              protocol: TCP
              containerPort: {{ $liveness.port }}
            {{- end }}
            {{- if $readiness.enabled }}
            - name: readiness
              protocol: TCP
              containerPort: {{ $readiness.port }}
            {{- end }}
            {{- if $grpc.enabled }}
            - name: grpc
              protocol: TCP
              containerPort: {{ $grpc.port }}
            {{- end }}
            {{- if $pprof.enabled }}
            - name: pprof
              protocol: TCP
              containerPort: {{ $pprof.port }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.name }}-config
              mountPath: /etc/server/
            {{- if .Values.default_vrs.enabled }}
            - name: {{ .Values.name }}-default-vrs
              mountPath: {{ dir .Values.operator.vrs.default_vrs_path }}/
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      dnsPolicy: {{ .Values.dnsPolicy }}
      restartPolicy: {{ .Values.restartPolicy }}
      schedulerName: {{ .Values.schedulerName }}
      serviceAccountName: {{ include "vald.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: {{ .Values.name }}-config
          configMap:
            defaultMode: 420
            name: {{ .Values.name }}-config
        {{- if .Values.default_vrs.enabled }}
        - name: {{ .Values.name }}-default-vrs
          configMap:
            defaultMode: 420
            name: {{ include "vald-operator.defaultVrsConfigMapName" . }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
