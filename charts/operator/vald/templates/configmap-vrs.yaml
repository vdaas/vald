{{- if and .Values.default_vrs.enabled (not .Values.default_vrs.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-default-vrs
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vald-operator.labels" . | nindent 4 }}
data:
  vrs.yaml: |
    apiVersion: vald.vdaas.org/v1
    kind: ValdRelease
    metadata:
      name: {{ .Values.default_vrs.name }}
    spec:
      {{- toYaml .Values.default_vrs.spec | nindent 6 }}
{{- end }}
