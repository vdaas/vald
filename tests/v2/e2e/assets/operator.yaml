time_zone: UTC
logging:
  format: raw
  level: info
  logger: glg
kubernetes:
  kube_config: _KUBECONFIG_
  port_forward:
    enabled: true
    local_port: 6060
    namespace: _E2E_TARGET_NAMESPACE_
    service_name: _E2E_TARGET_NAME_
    target_port: 6060
strategies:
  - name: Verify vald-operator deployment
    concurrency: 1
    operations:
      - name: operator readiness
        executions:
          - name: wait for vald-operator pod to be available
            type: kubernetes
            mode: other
            timeout: 5m
            kubernetes:
              action: wait
              kind: pod
              namespace: _E2E_TARGET_NAMESPACE_
              label_selector: app=vald-operator
              status: available
          - name: wait for vald-operator deployment to be available
            type: kubernetes
            mode: other
            timeout: 5m
            kubernetes:
              action: wait
              kind: deployment
              namespace: _E2E_TARGET_NAMESPACE_
              name: vald-operator
              status: available
  - name: Verify operator process responds
    concurrency: 1
    operations:
      - name: pprof endpoint serves profile index
        executions:
          - name: fetch pprof index over portforward
            type: http
            mode: other
            delay: 5s
            timeout: 2m
            http:
              method: GET
              url: "http://localhost:6060/debug/pprof/"
            expect:
              - op: contains
                value: "profiles"
  - name: Verify ValdOperatorRelease reconciliation
    concurrency: 1
    operations:
      - name: apply sample custom resource
        executions:
          - name: apply valdoperatorrelease sample manifest
            type: kubernetes
            mode: other
            timeout: 1m
            kubernetes:
              action: apply
              namespace: _E2E_TARGET_NAMESPACE_
              manifest: _E2E_MANIFEST_PATH_
      - name: wait for reconciliation to complete
        executions:
          - name: wait for valdoperatorrelease phase to reach Completed
            type: kubernetes
            mode: other
            timeout: 5m
            kubernetes:
              action: wait
              kind: customresource
              namespace: _E2E_TARGET_NAMESPACE_
              name: valdoperatorrelease-sample
              group: vald.vdaas.org
              version: v1
              resource: valdoperatorreleases
              status_path: "{.status.phase}"
              status_value: Completed
      - name: cleanup sample custom resource
        executions:
          - name: delete valdoperatorrelease sample
            type: kubernetes
            mode: other
            timeout: 1m
            kubernetes:
              action: delete
              kind: customresource
              namespace: _E2E_TARGET_NAMESPACE_
              name: valdoperatorrelease-sample
              group: vald.vdaas.org
              version: v1
              resource: valdoperatorreleases
