time_zone: UTC
logging:
  format: raw
  level: debug
  logger: glg
dataset:
  name: _E2E_DATASET_PATH_
kubernetes:
  kube_config: _KUBECONFIG_
  port_forward:
    enabled: true
    local_port: 8082
    namespace: _E2E_TARGET_NAMESPACE_
    service_name: _E2E_TARGET_NAME_
    target_port: 8081
target:
  addrs:
    - 127.0.0.1:8082
  health_check_duration: 1s
  connection_pool:
    enable_dns_resolver: true
    enable_rebalance: true
    old_conn_close_duration: 2m
    rebalance_duration: 30m
    size: 3
  backoff:
    backoff_factor: 1.1
    backoff_time_limit: 5s
    enable_error_log: false
    initial_duration: 5ms
    jitter_limit: 100ms
    maximum_duration: 5s
    retry_count: 100
  call_option:
    wait_for_ready: true
  dial_option:
    insecure: true
    min_connection_timeout: 20s
    net:
      network: tcp
      socket_option:
        reuse_addr: true
        reuse_port: true
metadata: {}
metrics:
  enabled: false
strategies:
  - concurrency: 1
    name: Insert and search through zvec agent
    operations:
      - name: Insert -> IndexInfo -> Search
        executions:
          - mode: unary
            name: Initial IndexInfo
            type: index_info
            expect:
              - value: {}
          - mode: unary
            name: Insert
            type: insert
            parallelism: _E2E_PARALLELISM_
            num: _E2E_INSERT_COUNT_
            qps: _E2E_QPS_
            wait: 10s
          - mode: unary
            name: IndexInfo
            type: index_info
            retry_until_success_timeout: 3m
            expect:
              - status_code: ok
                path: $.stored
                value: _E2E_EXPECTED_INDEX_
          - mode: unary
            name: Search
            type: search
            parallelism: _E2E_PARALLELISM_
            num: _E2E_SEARCH_COUNT_
            search:
              timeout: 3s
              k: 10
