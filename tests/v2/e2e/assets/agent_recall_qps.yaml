# agent_recall_qps.yaml drives an Insert -> CreateIndex -> Search flow
# directly against a single Vald Agent (bypassing the LB gateway, same target
# style as agent_crud.yaml) and evaluates ann-benchmarks-style recall@k
# alongside search QPS.
#
# recall@k is computed per search response with metrics.CalcRecall (see
# tests/v2/e2e/metrics/recall.go) against the dataset's ground-truth
# neighbors, and is recorded into the Search executions' own metrics
# collectors via the recall_sum_ppm/recall_samples custom counters (see
# tests/v2/e2e/crud/recall_qps_test.go); QPS is derived from each
# collector's request count and observed time span, which is already
# tracked for every recorded request with no extra bookkeeping. Both are
# logged as "Operation Metrics"/"Execution Metrics" entries once
# metrics.enabled is true and custom_counters includes the two names below.
time_zone: UTC
logging:
  format: raw
  level: debug
  logger: glg
metrics:
  enabled: true
  latency_histogram:
    num_shards: 16
  latency_tdigest:
    compression: 100
    compression_trigger_factor: 1.2
    num_shards: 16
    quantiles:
      - 0.5
      - 0.9
      - 0.95
      - 0.99
  exemplar:
    capacity: 10
    num_shards: 16
    sampling_rate: 16
  detailed_error_tracking: true
  custom_counters:
    - recall_sum_ppm
    - recall_samples
dataset:
  name: _E2E_DATASET_PATH_
kubernetes:
  kube_config: _KUBECONFIG_
  port_forward:
    enabled: true
    local_port: 8082
    namespace: _E2E_TARGET_NAMESPACE_
    service_name: _E2E_TARGET_NAME_
    target_port: 8081
target:
  addrs:
    - 127.0.0.1:8082
  health_check_duration: 1s
  connection_pool:
    enable_dns_resolver: true
    enable_rebalance: true
    old_conn_close_duration: 2m
    rebalance_duration: 30m
    size: 3
  backoff:
    backoff_factor: 1.1
    backoff_time_limit: 5s
    enable_error_log: false
    initial_duration: 5ms
    jitter_limit: 100ms
    maximum_duration: 5s
    retry_count: 100
  call_option:
    content_subtype: ""
    max_recv_msg_size: 0
    max_retry_rpc_buffer_size: 0
    max_send_msg_size: 0
    wait_for_ready: true
  dial_option:
    authority: ""
    backoff_base_delay: 1s
    backoff_jitter: 0.2
    backoff_max_delay: 120s
    backoff_multiplier: 1.6
    disable_retry: false
    enable_backoff: true
    idle_timeout: ""
    initial_connection_window_size: 2097152
    initial_window_size: 1048576
    insecure: true
    interceptors: []
    keepalive:
      permit_without_stream: false
      time: ""
      timeout: 30s
    max_call_attempts: 0
    max_header_list_size: 0
    max_msg_size: 0
    min_connection_timeout: 20s
    net:
      dialer:
        dual_stack_enabled: true
        keepalive: ""
        timeout: ""
      dns:
        cache_enabled: true
        cache_expiration: 1h
        refresh_duration: 30m
      network: tcp
      socket_option:
        ip_recover_destination_addr: false
        ip_transparent: false
        reuse_addr: true
        reuse_port: true
        tcp_cork: false
        tcp_defer_accept: false
        tcp_fast_open: false
        tcp_no_delay: false
        tcp_quick_ack: false
      tls:
        ca: /path/to/ca
        cert: /path/to/cert
        enabled: false
        insecure_skip_verify: true
        key: /path/to/key
    read_buffer_size: 0
    shared_write_buffer: true
    timeout: ""
    user_agent: Vald-gRPC
    write_buffer_size: 0
  tls:
    ca: /path/to/ca
    cert: /path/to/cert
    enabled: false
    insecure_skip_verify: true
    key: /path/to/key
strategies:
  - concurrency: 1
    name: Insert and CreateIndex
    operations:
      - name: Insert -> CreateIndex -> IndexInfo
        executions:
          - name: Insert
            type: insert
            mode: unary
            parallelism: _E2E_PARALLELISM_
            num: _E2E_INSERT_COUNT_
            qps: _E2E_QPS_
            wait: 2m
          - mode: unary
            name: CreateIndex
            type: create_index
            expect:
              - status_code: ok
              # The agent's auto-indexing may have already committed every
              # inserted vector by the time this explicit CreateIndex runs, in
              # which case it returns FailedPrecondition
              # ("uncommitted indexes are not found").
              - status_code: failedprecondition
          # retry_until_success_timeout was never a real config key (unknown
          # keys are silently dropped); repeats with exit_condition: success
          # bounded by the execution timeout is the working retry construct.
          - mode: unary
            name: IndexInfo
            type: index_info
            timeout: 5m
            repeats:
              enabled: true
              exit_condition: success
              interval: 5s
            expect:
              - status_code: ok
                path: $.stored
                op: ge
                value: _E2E_EXPECTED_INDEX_
          # $.stored can already report the target count while the NGT graph
          # build is still in progress (indexing: true), and $.indexing cannot
          # be asserted via expect because protojson omits false fields. Probe
          # with a real search until the agent stops returning Aborted
          # ("creating indices is in progress") before measuring recall/QPS.
          - mode: unary
            name: WaitSearchReady
            type: search
            num: 1
            parallelism: 1
            timeout: 5m
            repeats:
              enabled: true
              exit_condition: success
              interval: 5s
            search:
              k: 10
              timeout: 3s
              algorithm: cq
            expect:
              - status_code: ok
  - concurrency: 1
    name: Agent Recall and QPS
    operations:
      - name: Search Operation
        executions:
          - name: Search recall@k
            type: search
            mode: unary
            parallelism: _E2E_PARALLELISM_
            num: _E2E_SEARCH_COUNT_
            search:
              k: 10
              timeout: 3s
              algorithm: cq
