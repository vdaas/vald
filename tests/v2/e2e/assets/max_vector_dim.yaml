time_zone: UTC
logging:
  format: raw
  level: debug
  logger: glg
dataset:
  # No HDF5 fixture: a single Gaussian vector of this dimension is generated
  # in memory (see tests/v2/e2e/crud/crud_test.go newSyntheticDataset).
  dimension: _E2E_MAX_DIM_
kubernetes:
  kube_config: _KUBECONFIG_
  port_forward:
    enabled: _E2E_PORTFORWARD_ENABLED_
    local_port: 8082
    namespace: _E2E_TARGET_NAMESPACE_
    service_name: _E2E_TARGET_NAME_
    target_port: 8081
target:
  addrs:
    - 127.0.0.1:8082
  health_check_duration: 1s
  connection_pool:
    enable_dns_resolver: true
    enable_rebalance: true
    old_conn_close_duration: 2m
    rebalance_duration: 30m
    size: 3
  backoff:
    backoff_factor: 1.1
    backoff_time_limit: 5s
    enable_error_log: false
    initial_duration: 5ms
    jitter_limit: 100ms
    maximum_duration: 5s
    retry_count: 100
  call_option:
    content_subtype: ""
    max_recv_msg_size: 0
    max_retry_rpc_buffer_size: 0
    max_send_msg_size: 0
    wait_for_ready: true
  dial_option:
    authority: ""
    backoff_base_delay: 1s
    backoff_jitter: 0.2
    backoff_max_delay: 120s
    backoff_multiplier: 1.6
    disable_retry: false
    enable_backoff: true
    idle_timeout: ""
    initial_connection_window_size: 2097152
    initial_window_size: 1048576
    insecure: true
    interceptors: []
    keepalive:
      permit_without_stream: true
      time: 1s
      timeout: 5m
    max_call_attempts: 0
    max_header_list_size: 0
    max_msg_size: 0
    min_connection_timeout: 20s
    net:
      dialer:
        dual_stack_enabled: true
        keepalive: ""
        timeout: ""
      dns:
        cache_enabled: true
        cache_expiration: 1h
        refresh_duration: 30m
      network: tcp
      socket_option:
        ip_recover_destination_addr: false
        ip_transparent: false
        reuse_addr: true
        reuse_port: true
        tcp_cork: false
        tcp_defer_accept: false
        tcp_fast_open: false
        tcp_no_delay: false
        tcp_quick_ack: false
      tls:
        ca: /path/to/ca
        cert: /path/to/cert
        enabled: false
        insecure_skip_verify: true
        key: /path/to/key
    read_buffer_size: 0
    shared_write_buffer: true
    timeout: ""
    user_agent: Vald-gRPC
    write_buffer_size: 0
  tls:
    ca: /path/to/ca
    cert: /path/to/cert
    enabled: false
    insecure_skip_verify: true
    key: /path/to/key
metadata:
  bit: _E2E_MAX_DIM_BIT_
strategies:
  - concurrency: 1
    name: Insert single max-dimension vector and confirm it becomes searchable
    operations:
      - name: Insert -> SearchByID
        executions:
          - name: Insert
            type: insert
            mode: unary
            num: 1
            # A ResourceExhausted response means the cluster (deployed with
            # agent.ngt.dimension=_E2E_MAX_DIM_) rejected this dimension
            # outright; that is a legitimate boundary result for this probe,
            # not a test failure. Only an unexpected status here should fail
            # the scenario. expect entries are evaluated in order and the
            # execution passes on the first match (see
            # tests/v2/e2e/crud/grpc_test.go handleGRPCWithStatusCode), so
            # either status_code below is accepted.
            expect:
              - status_code: ok
              - status_code: resourceexhausted
          - name: SearchByID
            type: search_by_id
            mode: unary
            num: 1
            # Indexing runs asynchronously after Insert; retry until the
            # vector is searchable or the execution timeout below elapses.
            timeout: _E2E_MAX_DIM_RETRY_TIMEOUT_
            repeats:
              enabled: true
              exit_condition: success
              interval: _E2E_MAX_DIM_WAIT_
            search:
              timeout: 3s
            # exit_condition: success (see executeWithRepeats in
            # tests/v2/e2e/crud/strategy_test.go) exits as soon as an attempt
            # succeeds, retries on any non-timeout error, and stops without
            # failing once the execution timeout above elapses. If Insert
            # legitimately ended in ResourceExhausted above, the vector was
            # never stored, so every SearchByID attempt here returns NotFound
            # (an expect mismatch, i.e. a retryable error), and this scenario
            # keeps retrying for the full _E2E_MAX_DIM_RETRY_TIMEOUT_ before
            # passing once the timeout is reached. That is slower than the
            # real-vector path, but it is still a correct pass for this
            # legitimate boundary case.
            expect:
              - status_code: ok
                path: $.results.length()
                op: ge
                value: 1
